<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Theme must be applied before the stylesheet paints, otherwise dark-mode
      users get a white flash. This runs synchronously during head parsing —
      doing it from main.tsx is too late (module scripts execute after the
      first paint is already possible).
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = theme === 'dark' ? '#09090b' : '#ffffff';
          document.addEventListener('DOMContentLoaded', function () {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', theme === 'dark' ? '#09090b' : '#ffffff');
          });
        } catch (e) {}
      })();
    </script>

    <!-- Primary SEO — static fallbacks for crawlers before JS loads -->
    <!-- SEO.tsx overrides title + description dynamically at runtime -->
    <title>Swade Stack | Professional Web Solutions</title>
    <meta name="description" content="Professional web design and development services" />
    <link rel="canonical" href="https://swadestack.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://swadestack.com/" />
    <meta property="og:title" content="Swade Stack | Professional Web Solutions" />
    <meta property="og:description" content="Professional web design and development services" />
    <meta property="og:image" content="https://swadestack.com/uploads/1771082210022-250559777.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://swadestack.com/" />
    <meta name="twitter:title" content="Swade Stack | Professional Web Solutions" />
    <meta name="twitter:description" content="Professional web design and development services" />
    <meta name="twitter:image" content="https://swadestack.com/uploads/1771082210022-250559777.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="https://swadestack.com/uploads/1771074948605-336071056.png" />
    <link rel="apple-touch-icon" href="https://swadestack.com/uploads/1771074948605-336071056.png" />

    <meta name="theme-color" content="#ffffff" />

    <!-- Google Search Console Verification (uncomment and add your code) -->
    <!-- <meta name="google-site-verification" content="YOUR_CODE_HERE" /> -->

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
