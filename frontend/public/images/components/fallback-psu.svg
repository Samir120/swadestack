<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- PSU box with fan grille -->
  <g transform="translate(200,135)">
    <!-- Main box body -->
    <rect x="-78" y="-54" width="156" height="100" rx="4" fill="rgba(71,85,105,0.04)" stroke="#475569" stroke-width="1.8"/>
    <!-- Fan grille circle -->
    <circle cx="-2" cy="-6" r="38" fill="none" stroke="#475569" stroke-width="1.2"/>
    <!-- Grille rings -->
    <circle cx="-2" cy="-6" r="30" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.3"/>
    <circle cx="-2" cy="-6" r="22" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.3"/>
    <circle cx="-2" cy="-6" r="14" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.3"/>
    <!-- Grille crosshairs -->
    <line x1="-40" y1="-6" x2="36" y2="-6" stroke="#94a3b8" stroke-width="0.5" opacity="0.3"/>
    <line x1="-2" y1="-44" x2="-2" y2="32" stroke="#94a3b8" stroke-width="0.5" opacity="0.3"/>
    <!-- Honeycomb dots -->
    <g opacity="0.2" fill="#475569">
      <circle cx="-26" cy="-28" r="1.5"/><circle cx="-14" cy="-28" r="1.5"/>
      <circle cx="10" cy="-28" r="1.5"/><circle cx="22" cy="-28" r="1.5"/>
      <circle cx="-26" cy="16" r="1.5"/><circle cx="-14" cy="16" r="1.5"/>
      <circle cx="10" cy="16" r="1.5"/><circle cx="22" cy="16" r="1.5"/>
    </g>
    <!-- Power switch -->
    <rect x="52" y="-46" width="14" height="8" rx="2" fill="rgba(71,85,105,0.06)" stroke="#475569" stroke-width="0.8"/>
    <line x1="56" y1="-42" x2="62" y2="-42" stroke="#94a3b8" stroke-width="0.6" opacity="0.5"/>
    <!-- AC inlet -->
    <rect x="50" y="-32" width="18" height="14" rx="1" fill="rgba(71,85,105,0.05)" stroke="#475569" stroke-width="0.8"/>
    <circle cx="54" cy="-25" r="2" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.4"/>
    <circle cx="64" cy="-25" r="2" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.4"/>
    <circle cx="59" cy="-21" r="2" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.4"/>
    <!-- Modular cable ports -->
    <g opacity="0.45" stroke="#475569" stroke-width="0.6" fill="none">
      <rect x="-58" y="38" width="10" height="6" rx="1"/>
      <rect x="-43" y="38" width="10" height="6" rx="1"/>
      <rect x="-28" y="38" width="10" height="6" rx="1"/>
      <rect x="-13" y="38" width="10" height="6" rx="1"/>
      <rect x="2" y="38" width="10" height="6" rx="1"/>
      <rect x="17" y="38" width="10" height="6" rx="1"/>
    </g>
    <!-- Label -->
    <rect x="-70" y="-48" width="42" height="12" rx="1" fill="none" stroke="#94a3b8" stroke-width="0.4" opacity="0.3"/>
  </g>
  <text x="200" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Power Supply</text>
</svg>