<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- M.2 NVMe stick -->
  <g transform="translate(200,135)">
    <!-- PCB stick -->
    <rect x="-95" y="-14" width="190" height="28" rx="2" fill="rgba(71,85,105,0.04)" stroke="#475569" stroke-width="1.8"/>
    <!-- M.2 connector notch -->
    <path d="M-95,-7 L-101,-7 L-101,7 L-95,7" fill="rgba(71,85,105,0.06)" stroke="#475569" stroke-width="1.2"/>
    <!-- Controller chip -->
    <rect x="-65" y="-8" width="20" height="16" rx="1" fill="rgba(71,85,105,0.1)" stroke="#475569" stroke-width="1"/>
    <!-- NAND chips -->
    <rect x="-32" y="-8" width="24" height="16" rx="1" fill="rgba(71,85,105,0.08)" stroke="#475569" stroke-width="0.8"/>
    <rect x="0" y="-8" width="24" height="16" rx="1" fill="rgba(71,85,105,0.08)" stroke="#475569" stroke-width="0.8"/>
    <rect x="32" y="-8" width="24" height="16" rx="1" fill="rgba(71,85,105,0.08)" stroke="#475569" stroke-width="0.8"/>
    <rect x="64" y="-8" width="24" height="16" rx="1" fill="rgba(71,85,105,0.08)" stroke="#475569" stroke-width="0.8"/>
    <!-- Mounting hole -->
    <circle cx="90" cy="0" r="3" fill="rgba(71,85,105,0.08)" stroke="#475569" stroke-width="0.8"/>
    <!-- Label line -->
    <line x1="-55" y1="-20" x2="55" y2="-20" stroke="#94a3b8" stroke-width="0.4" opacity="0.35"/>
    <!-- Connector pins -->
    <g opacity="0.35">
      <line x1="-95" y1="-9" x2="-95" y2="-5" stroke="#475569" stroke-width="2"/>
      <line x1="-95" y1="5" x2="-95" y2="9" stroke="#475569" stroke-width="2"/>
    </g>
  </g>
  <text x="200" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">SSD Storage</text>
</svg>