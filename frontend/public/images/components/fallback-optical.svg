<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Optical Drive -->
  <g transform="translate(200,135)">
    <!-- Drive body -->
    <rect x="-90" y="-32" width="180" height="58" rx="3" fill="rgba(71,85,105,0.04)" stroke="#475569" stroke-width="1.8"/>
    <!-- Front panel -->
    <rect x="-90" y="-32" width="180" height="16" rx="3" fill="rgba(71,85,105,0.05)" stroke="#475569" stroke-width="1.2"/>
    <!-- Disc tray line -->
    <line x1="-82" y1="-16" x2="82" y2="-16" stroke="#475569" stroke-width="1" opacity="0.5"/>
    <!-- Eject button -->
    <rect x="62" y="-28" width="14" height="6" rx="2" fill="rgba(71,85,105,0.08)" stroke="#475569" stroke-width="0.8"/>
    <!-- Activity LED -->
    <circle cx="52" cy="-25" r="1.5" fill="rgba(71,85,105,0.12)" stroke="#475569" stroke-width="0.6"/>
    <!-- Manual eject hole -->
    <circle cx="-72" cy="-25" r="1" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.4"/>
    <!-- Disc visible inside -->
    <circle cx="0" cy="5" r="22" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.2"/>
    <circle cx="0" cy="5" r="8" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.2"/>
    <circle cx="0" cy="5" r="3" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.2"/>
    <!-- SATA connectors at back -->
    <rect x="-62" y="21" width="18" height="5" rx="1" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.3"/>
    <rect x="-38" y="21" width="12" height="5" rx="1" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.3"/>
  </g>
  <text x="200" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Optical Drive</text>
</svg>