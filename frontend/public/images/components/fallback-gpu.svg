<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- GPU side profile -->
  <g transform="translate(200,135)">
    <!-- Backplate -->
    <rect x="-115" y="-44" width="230" height="76" rx="4" fill="rgba(71,85,105,0.04)" stroke="#475569" stroke-width="1.8"/>
    <!-- Shroud/body -->
    <rect x="-110" y="-39" width="220" height="66" rx="3" fill="rgba(71,85,105,0.05)" stroke="#475569" stroke-width="1.2"/>
    <!-- Fan 1 -->
    <circle cx="-48" cy="-6" r="27" fill="none" stroke="#475569" stroke-width="1.2"/>
    <circle cx="-48" cy="-6" r="6" fill="rgba(71,85,105,0.08)" stroke="#475569" stroke-width="0.8"/>
    <g stroke="#94a3b8" stroke-width="0.8" opacity="0.45">
      <path d="M-48,-33 C-41,-22 -38,-14 -48,-6" fill="none"/>
      <path d="M-21,-6 C-31,-14 -39,-17 -48,-6" fill="none"/>
      <path d="M-48,21 C-55,10 -58,2 -48,-6" fill="none"/>
      <path d="M-75,-6 C-65,2 -57,4 -48,-6" fill="none"/>
    </g>
    <!-- Fan 2 -->
    <circle cx="28" cy="-6" r="27" fill="none" stroke="#475569" stroke-width="1.2"/>
    <circle cx="28" cy="-6" r="6" fill="rgba(71,85,105,0.08)" stroke="#475569" stroke-width="0.8"/>
    <g stroke="#94a3b8" stroke-width="0.8" opacity="0.45">
      <path d="M28,-33 C35,-22 38,-14 28,-6" fill="none"/>
      <path d="M55,-6 C45,-14 37,-17 28,-6" fill="none"/>
      <path d="M28,21 C21,10 18,2 28,-6" fill="none"/>
      <path d="M1,-6 C11,2 19,4 28,-6" fill="none"/>
    </g>
    <!-- PCIe bracket -->
    <rect x="105" y="-44" width="10" height="76" rx="1" fill="rgba(71,85,105,0.05)" stroke="#475569" stroke-width="1"/>
    <!-- Display ports -->
    <rect x="107" y="-32" width="6" height="8" rx="1" fill="none" stroke="#94a3b8" stroke-width="0.6" opacity="0.5"/>
    <rect x="107" y="-20" width="6" height="8" rx="1" fill="none" stroke="#94a3b8" stroke-width="0.6" opacity="0.5"/>
    <rect x="107" y="-8" width="6" height="8" rx="1" fill="none" stroke="#94a3b8" stroke-width="0.6" opacity="0.5"/>
    <!-- Power connector -->
    <rect x="-105" y="-39" width="16" height="10" rx="1" fill="none" stroke="#94a3b8" stroke-width="0.6" opacity="0.4"/>
  </g>
  <text x="200" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Graphics Card</text>
</svg>