<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Motherboard PCB -->
  <g transform="translate(200,138)">
    <!-- Board outline -->
    <rect x="-90" y="-80" width="180" height="158" rx="2" fill="rgba(71,85,105,0.04)" stroke="#475569" stroke-width="1.8"/>
    <!-- Mounting holes -->
    <circle cx="-80" cy="-70" r="3" fill="none" stroke="#94a3b8" stroke-width="0.8" opacity="0.4"/>
    <circle cx="80" cy="-70" r="3" fill="none" stroke="#94a3b8" stroke-width="0.8" opacity="0.4"/>
    <circle cx="-80" cy="68" r="3" fill="none" stroke="#94a3b8" stroke-width="0.8" opacity="0.4"/>
    <circle cx="80" cy="68" r="3" fill="none" stroke="#94a3b8" stroke-width="0.8" opacity="0.4"/>
    <!-- CPU socket -->
    <rect x="-48" y="-55" width="44" height="44" rx="1" fill="rgba(71,85,105,0.06)" stroke="#475569" stroke-width="1.2"/>
    <rect x="-40" y="-47" width="28" height="28" rx="1" fill="none" stroke="#94a3b8" stroke-width="0.6" opacity="0.5"/>
    <!-- RAM slots -->
    <rect x="22" y="-60" width="6" height="52" rx="1" fill="rgba(71,85,105,0.05)" stroke="#475569" stroke-width="1"/>
    <rect x="32" y="-60" width="6" height="52" rx="1" fill="rgba(71,85,105,0.05)" stroke="#475569" stroke-width="1"/>
    <rect x="42" y="-60" width="6" height="52" rx="1" fill="rgba(71,85,105,0.05)" stroke="#475569" stroke-width="1"/>
    <rect x="52" y="-60" width="6" height="52" rx="1" fill="rgba(71,85,105,0.05)" stroke="#475569" stroke-width="1"/>
    <!-- PCIe slots -->
    <rect x="-58" y="8" width="82" height="6" rx="1" fill="rgba(71,85,105,0.05)" stroke="#475569" stroke-width="1"/>
    <rect x="-58" y="22" width="82" height="6" rx="1" fill="rgba(71,85,105,0.05)" stroke="#475569" stroke-width="1"/>
    <rect x="-58" y="36" width="42" height="4" rx="1" fill="rgba(71,85,105,0.04)" stroke="#94a3b8" stroke-width="0.8"/>
    <!-- Circuit traces -->
    <g stroke="#94a3b8" stroke-width="0.5" opacity="0.3">
      <path d="M-4,-33 L12,-33 L12,-60" fill="none"/>
      <path d="M-4,-22 L16,-22 L16,-12 L22,-12" fill="none"/>
      <path d="M-48,-18 L-58,-18 L-58,8" fill="none"/>
      <path d="M62,-22 L72,-22 L72,8 L24,8" fill="none"/>
    </g>
    <!-- I/O panel -->
    <rect x="-90" y="-80" width="22" height="42" fill="rgba(71,85,105,0.05)" stroke="#94a3b8" stroke-width="0.8"/>
    <!-- Chipset heatsink -->
    <rect x="36" y="14" width="32" height="22" rx="2" fill="rgba(71,85,105,0.06)" stroke="#94a3b8" stroke-width="0.8"/>
  </g>
  <text x="200" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Motherboard</text>
</svg>