<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Monitor with OS window -->
  <g transform="translate(200,125)">
    <!-- Monitor bezel -->
    <rect x="-68" y="-58" width="136" height="94" rx="5" fill="rgba(71,85,105,0.04)" stroke="#475569" stroke-width="1.8"/>
    <!-- Screen area -->
    <rect x="-58" y="-48" width="116" height="74" rx="2" fill="rgba(71,85,105,0.03)" stroke="#475569" stroke-width="0.8"/>
    <!-- Windows-style 4-pane icon -->
    <g transform="translate(0,-11)">
      <rect x="-20" y="-20" width="18" height="18" rx="1.5" fill="rgba(71,85,105,0.1)" stroke="#475569" stroke-width="1"/>
      <rect x="2" y="-20" width="18" height="18" rx="1.5" fill="rgba(71,85,105,0.1)" stroke="#475569" stroke-width="1"/>
      <rect x="-20" y="2" width="18" height="18" rx="1.5" fill="rgba(71,85,105,0.1)" stroke="#475569" stroke-width="1"/>
      <rect x="2" y="2" width="18" height="18" rx="1.5" fill="rgba(71,85,105,0.1)" stroke="#475569" stroke-width="1"/>
    </g>
    <!-- Stand -->
    <rect x="-14" y="36" width="28" height="14" rx="1" fill="none" stroke="#475569" stroke-width="1.2"/>
    <!-- Stand base -->
    <rect x="-30" y="50" width="60" height="4" rx="2" fill="rgba(71,85,105,0.05)" stroke="#475569" stroke-width="1"/>
    <!-- Gear overlay in corner -->
    <g transform="translate(40,-32)" opacity="0.45">
      <circle cx="0" cy="0" r="8" fill="none" stroke="#475569" stroke-width="1"/>
      <circle cx="0" cy="0" r="3" fill="none" stroke="#475569" stroke-width="0.8"/>
      <line x1="0" y1="-9.5" x2="0" y2="-6.5" stroke="#475569" stroke-width="2"/>
      <line x1="0" y1="6.5" x2="0" y2="9.5" stroke="#475569" stroke-width="2"/>
      <line x1="-9.5" y1="0" x2="-6.5" y2="0" stroke="#475569" stroke-width="2"/>
      <line x1="6.5" y1="0" x2="9.5" y2="0" stroke="#475569" stroke-width="2"/>
      <line x1="-6.7" y1="-6.7" x2="-4.6" y2="-4.6" stroke="#475569" stroke-width="2"/>
      <line x1="4.6" y1="4.6" x2="6.7" y2="6.7" stroke="#475569" stroke-width="2"/>
      <line x1="6.7" y1="-6.7" x2="4.6" y2="-4.6" stroke="#475569" stroke-width="2"/>
      <line x1="-4.6" y1="4.6" x2="-6.7" y2="6.7" stroke="#475569" stroke-width="2"/>
    </g>
  </g>
  <text x="200" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Operating System</text>
</svg>