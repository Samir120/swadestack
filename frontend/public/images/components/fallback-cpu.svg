<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- CPU chip top-down view -->
  <g transform="translate(200,135)">
    <!-- Outer package -->
    <rect x="-56" y="-56" width="112" height="112" rx="3" fill="rgba(71,85,105,0.06)" stroke="#475569" stroke-width="1.8"/>
    <!-- Corner notch -->
    <path d="M-56,-56 L-56,-44 L-44,-56 Z" fill="rgba(71,85,105,0.08)" stroke="#475569" stroke-width="1.8"/>
    <!-- Heat spreader lid -->
    <rect x="-40" y="-40" width="80" height="80" rx="2" fill="rgba(71,85,105,0.06)" stroke="#475569" stroke-width="1.2"/>
    <!-- Lid text lines -->
    <line x1="-26" y1="-20" x2="26" y2="-20" stroke="#94a3b8" stroke-width="0.8" opacity="0.6"/>
    <line x1="-26" y1="-8" x2="18" y2="-8" stroke="#94a3b8" stroke-width="0.8" opacity="0.6"/>
    <line x1="-26" y1="4" x2="22" y2="4" stroke="#94a3b8" stroke-width="0.8" opacity="0.6"/>
    <!-- Pin grid -->
    <g opacity="0.35" stroke="#475569" stroke-width="1">
      <!-- Top pins -->
      <line x1="-38" y1="-62" x2="-38" y2="-56"/><line x1="-26" y1="-62" x2="-26" y2="-56"/>
      <line x1="-14" y1="-62" x2="-14" y2="-56"/><line x1="0" y1="-62" x2="0" y2="-56"/>
      <line x1="14" y1="-62" x2="14" y2="-56"/><line x1="26" y1="-62" x2="26" y2="-56"/>
      <line x1="38" y1="-62" x2="38" y2="-56"/>
      <!-- Bottom pins -->
      <line x1="-38" y1="56" x2="-38" y2="62"/><line x1="-26" y1="56" x2="-26" y2="62"/>
      <line x1="-14" y1="56" x2="-14" y2="62"/><line x1="0" y1="56" x2="0" y2="62"/>
      <line x1="14" y1="56" x2="14" y2="62"/><line x1="26" y1="56" x2="26" y2="62"/>
      <line x1="38" y1="56" x2="38" y2="62"/>
      <!-- Left pins -->
      <line x1="-62" y1="-38" x2="-56" y2="-38"/><line x1="-62" y1="-26" x2="-56" y2="-26"/>
      <line x1="-62" y1="-14" x2="-56" y2="-14"/><line x1="-62" y1="0" x2="-56" y2="0"/>
      <line x1="-62" y1="14" x2="-56" y2="14"/><line x1="-62" y1="26" x2="-56" y2="26"/>
      <line x1="-62" y1="38" x2="-56" y2="38"/>
      <!-- Right pins -->
      <line x1="56" y1="-38" x2="62" y2="-38"/><line x1="56" y1="-26" x2="62" y2="-26"/>
      <line x1="56" y1="-14" x2="62" y2="-14"/><line x1="56" y1="0" x2="62" y2="0"/>
      <line x1="56" y1="14" x2="62" y2="14"/><line x1="56" y1="26" x2="62" y2="26"/>
      <line x1="56" y1="38" x2="62" y2="38"/>
    </g>
  </g>
  <text x="200" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Processor</text>
</svg>