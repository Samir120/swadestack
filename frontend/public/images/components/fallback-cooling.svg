<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Tower Air Cooler with fan -->
  <g transform="translate(200,135)">
    <!-- Heatsink fins (tower) -->
    <g opacity="0.5">
      <rect x="5" y="-58" width="64" height="2" rx="0.5" fill="rgba(71,85,105,0.12)" stroke="#475569" stroke-width="0.5"/>
      <rect x="5" y="-50" width="64" height="2" rx="0.5" fill="rgba(71,85,105,0.12)" stroke="#475569" stroke-width="0.5"/>
      <rect x="5" y="-42" width="64" height="2" rx="0.5" fill="rgba(71,85,105,0.12)" stroke="#475569" stroke-width="0.5"/>
      <rect x="5" y="-34" width="64" height="2" rx="0.5" fill="rgba(71,85,105,0.12)" stroke="#475569" stroke-width="0.5"/>
      <rect x="5" y="-26" width="64" height="2" rx="0.5" fill="rgba(71,85,105,0.12)" stroke="#475569" stroke-width="0.5"/>
      <rect x="5" y="-18" width="64" height="2" rx="0.5" fill="rgba(71,85,105,0.12)" stroke="#475569" stroke-width="0.5"/>
      <rect x="5" y="-10" width="64" height="2" rx="0.5" fill="rgba(71,85,105,0.12)" stroke="#475569" stroke-width="0.5"/>
      <rect x="5" y="-2" width="64" height="2" rx="0.5" fill="rgba(71,85,105,0.12)" stroke="#475569" stroke-width="0.5"/>
      <rect x="5" y="6" width="64" height="2" rx="0.5" fill="rgba(71,85,105,0.12)" stroke="#475569" stroke-width="0.5"/>
      <rect x="5" y="14" width="64" height="2" rx="0.5" fill="rgba(71,85,105,0.12)" stroke="#475569" stroke-width="0.5"/>
      <rect x="5" y="22" width="64" height="2" rx="0.5" fill="rgba(71,85,105,0.12)" stroke="#475569" stroke-width="0.5"/>
      <rect x="5" y="30" width="64" height="2" rx="0.5" fill="rgba(71,85,105,0.12)" stroke="#475569" stroke-width="0.5"/>
    </g>
    <!-- Heatsink outline -->
    <rect x="5" y="-62" width="64" height="98" rx="2" fill="none" stroke="#475569" stroke-width="1.5"/>
    <!-- Heat pipes at top -->
    <circle cx="22" cy="-62" r="3.5" fill="none" stroke="#475569" stroke-width="0.8" opacity="0.5"/>
    <circle cx="37" cy="-62" r="3.5" fill="none" stroke="#475569" stroke-width="0.8" opacity="0.5"/>
    <circle cx="52" cy="-62" r="3.5" fill="none" stroke="#475569" stroke-width="0.8" opacity="0.5"/>
    <!-- Fan in front -->
    <rect x="-58" y="-54" width="58" height="86" rx="3" fill="rgba(71,85,105,0.03)" stroke="#475569" stroke-width="1.2"/>
    <circle cx="-29" cy="-11" r="32" fill="none" stroke="#475569" stroke-width="1" opacity="0.5"/>
    <circle cx="-29" cy="-11" r="6" fill="rgba(71,85,105,0.08)" stroke="#475569" stroke-width="0.8"/>
    <!-- Fan blades -->
    <g stroke="#94a3b8" stroke-width="0.7" opacity="0.4">
      <path d="M-29,-43 C-22,-30 -20,-20 -29,-11" fill="none"/>
      <path d="M3,-11 C-9,-20 -20,-22 -29,-11" fill="none"/>
      <path d="M-29,21 C-36,8 -38,-2 -29,-11" fill="none"/>
      <path d="M-61,-11 C-49,-2 -38,0 -29,-11" fill="none"/>
    </g>
    <!-- Base plate -->
    <rect x="-12" y="36" width="90" height="8" rx="1" fill="rgba(71,85,105,0.06)" stroke="#475569" stroke-width="0.8"/>
  </g>
  <text x="200" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">CPU Cooler</text>
</svg>