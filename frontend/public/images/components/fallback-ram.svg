<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- RAM stick profile -->
  <g transform="translate(200,135)">
    <!-- Heat spreader top -->
    <path d="M-92,-36 L-82,-50 L82,-50 L92,-36 Z" fill="rgba(71,85,105,0.05)" stroke="#475569" stroke-width="1.5"/>
    <!-- PCB body -->
    <rect x="-92" y="-36" width="184" height="62" rx="1" fill="rgba(71,85,105,0.04)" stroke="#475569" stroke-width="1.8"/>
    <!-- Memory chips -->
    <rect x="-80" y="-22" width="14" height="18" rx="1" fill="rgba(71,85,105,0.08)" stroke="#475569" stroke-width="0.8"/>
    <rect x="-60" y="-22" width="14" height="18" rx="1" fill="rgba(71,85,105,0.08)" stroke="#475569" stroke-width="0.8"/>
    <rect x="-40" y="-22" width="14" height="18" rx="1" fill="rgba(71,85,105,0.08)" stroke="#475569" stroke-width="0.8"/>
    <rect x="-20" y="-22" width="14" height="18" rx="1" fill="rgba(71,85,105,0.08)" stroke="#475569" stroke-width="0.8"/>
    <rect x="4" y="-22" width="14" height="18" rx="1" fill="rgba(71,85,105,0.08)" stroke="#475569" stroke-width="0.8"/>
    <rect x="24" y="-22" width="14" height="18" rx="1" fill="rgba(71,85,105,0.08)" stroke="#475569" stroke-width="0.8"/>
    <rect x="44" y="-22" width="14" height="18" rx="1" fill="rgba(71,85,105,0.08)" stroke="#475569" stroke-width="0.8"/>
    <rect x="64" y="-22" width="14" height="18" rx="1" fill="rgba(71,85,105,0.08)" stroke="#475569" stroke-width="0.8"/>
    <!-- Contact pins at bottom -->
    <g opacity="0.35" stroke="#475569" stroke-width="1.2">
      <line x1="-82" y1="26" x2="-82" y2="32"/><line x1="-72" y1="26" x2="-72" y2="32"/>
      <line x1="-62" y1="26" x2="-62" y2="32"/><line x1="-52" y1="26" x2="-52" y2="32"/>
      <line x1="-42" y1="26" x2="-42" y2="32"/><line x1="-32" y1="26" x2="-32" y2="32"/>
      <line x1="-22" y1="26" x2="-22" y2="32"/><line x1="-12" y1="26" x2="-12" y2="32"/>
      <line x1="12" y1="26" x2="12" y2="32"/><line x1="22" y1="26" x2="22" y2="32"/>
      <line x1="32" y1="26" x2="32" y2="32"/><line x1="42" y1="26" x2="42" y2="32"/>
      <line x1="52" y1="26" x2="52" y2="32"/><line x1="62" y1="26" x2="62" y2="32"/>
      <line x1="72" y1="26" x2="72" y2="32"/><line x1="82" y1="26" x2="82" y2="32"/>
    </g>
    <!-- Notch in contacts -->
    <rect x="-2" y="23" width="4" height="9" fill="rgba(71,85,105,0.15)"/>
    <!-- Label on spreader -->
    <line x1="-30" y1="-44" x2="30" y2="-44" stroke="#94a3b8" stroke-width="0.5" opacity="0.35"/>
  </g>
  <text x="200" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Memory (RAM)</text>
</svg>