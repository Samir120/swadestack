<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Case Fan front view -->
  <g transform="translate(200,132)">
    <!-- Square frame -->
    <rect x="-58" y="-58" width="116" height="116" rx="8" fill="rgba(71,85,105,0.03)" stroke="#475569" stroke-width="1.8"/>
    <!-- Screw holes -->
    <circle cx="-46" cy="-46" r="3.5" fill="rgba(71,85,105,0.06)" stroke="#475569" stroke-width="0.8"/>
    <circle cx="46" cy="-46" r="3.5" fill="rgba(71,85,105,0.06)" stroke="#475569" stroke-width="0.8"/>
    <circle cx="-46" cy="46" r="3.5" fill="rgba(71,85,105,0.06)" stroke="#475569" stroke-width="0.8"/>
    <circle cx="46" cy="46" r="3.5" fill="rgba(71,85,105,0.06)" stroke="#475569" stroke-width="0.8"/>
    <!-- Fan circle -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#475569" stroke-width="1.2"/>
    <!-- Hub -->
    <circle cx="0" cy="0" r="11" fill="rgba(71,85,105,0.08)" stroke="#475569" stroke-width="1.2"/>
    <!-- Fan blades (5 curved) -->
    <g fill="rgba(71,85,105,0.05)" stroke="#475569" stroke-width="1">
      <path d="M0,-11 C8,-16 20,-40 10,-46 C4,-42 -8,-22 0,-11 Z"/>
      <path d="M10,0 C16,8 40,20 46,10 C42,4 22,-8 10,0 Z" transform="rotate(72)"/>
      <path d="M10,0 C16,8 40,20 46,10 C42,4 22,-8 10,0 Z" transform="rotate(144)"/>
      <path d="M10,0 C16,8 40,20 46,10 C42,4 22,-8 10,0 Z" transform="rotate(216)"/>
      <path d="M10,0 C16,8 40,20 46,10 C42,4 22,-8 10,0 Z" transform="rotate(288)"/>
    </g>
    <!-- Cable connector -->
    <rect x="40" y="50" width="12" height="4" rx="1" fill="none" stroke="#94a3b8" stroke-width="0.6" opacity="0.4"/>
  </g>
  <text x="200" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Case Fan</text>
</svg>