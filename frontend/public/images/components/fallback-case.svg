<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- PC Tower Case -->
  <g transform="translate(200,140)">
    <!-- Main case body -->
    <rect x="-52" y="-84" width="104" height="162" rx="4" fill="rgba(71,85,105,0.04)" stroke="#475569" stroke-width="1.8"/>
    <!-- Front panel mesh -->
    <rect x="-44" y="-76" width="88" height="58" rx="2" fill="none" stroke="#94a3b8" stroke-width="0.8" opacity="0.5"/>
    <g opacity="0.25" stroke="#475569" stroke-width="0.6">
      <line x1="-38" y1="-72" x2="-38" y2="-22"/><line x1="-32" y1="-72" x2="-32" y2="-22"/>
      <line x1="-26" y1="-72" x2="-26" y2="-22"/><line x1="-20" y1="-72" x2="-20" y2="-22"/>
      <line x1="-14" y1="-72" x2="-14" y2="-22"/><line x1="-8" y1="-72" x2="-8" y2="-22"/>
      <line x1="-2" y1="-72" x2="-2" y2="-22"/><line x1="4" y1="-72" x2="4" y2="-22"/>
      <line x1="10" y1="-72" x2="10" y2="-22"/><line x1="16" y1="-72" x2="16" y2="-22"/>
      <line x1="22" y1="-72" x2="22" y2="-22"/><line x1="28" y1="-72" x2="28" y2="-22"/>
      <line x1="34" y1="-72" x2="34" y2="-22"/>
    </g>
    <!-- Tempered glass side panel -->
    <rect x="-44" y="-12" width="88" height="74" rx="2" fill="rgba(71,85,105,0.02)" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4 2" opacity="0.45"/>
    <!-- Components visible through glass -->
    <rect x="-32" y="-2" width="64" height="8" rx="1" fill="none" stroke="#94a3b8" stroke-width="0.4" opacity="0.2"/>
    <rect x="-32" y="12" width="64" height="8" rx="1" fill="none" stroke="#94a3b8" stroke-width="0.4" opacity="0.2"/>
    <!-- Front I/O -->
    <circle cx="-20" cy="-82" r="2.5" fill="none" stroke="#475569" stroke-width="0.8" opacity="0.5"/>
    <rect x="-8" y="-84" width="8" height="3" rx="1" fill="none" stroke="#475569" stroke-width="0.6" opacity="0.5"/>
    <rect x="6" y="-84" width="8" height="3" rx="1" fill="none" stroke="#475569" stroke-width="0.6" opacity="0.5"/>
    <!-- Power button -->
    <circle cx="28" cy="-82" r="3.5" fill="rgba(71,85,105,0.08)" stroke="#475569" stroke-width="0.8"/>
    <!-- Feet -->
    <rect x="-44" y="73" width="14" height="5" rx="2" fill="rgba(71,85,105,0.06)" stroke="#94a3b8" stroke-width="0.6"/>
    <rect x="30" y="73" width="14" height="5" rx="2" fill="rgba(71,85,105,0.06)" stroke="#94a3b8" stroke-width="0.6"/>
  </g>
  <text x="200" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Case</text>
</svg>