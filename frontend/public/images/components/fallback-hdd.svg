<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- 3.5" Hard Drive top view -->
  <g transform="translate(200,135)">
    <!-- Drive body -->
    <rect x="-74" y="-54" width="148" height="96" rx="4" fill="rgba(71,85,105,0.04)" stroke="#475569" stroke-width="1.8"/>
    <!-- Label area -->
    <rect x="-62" y="-44" width="88" height="36" rx="2" fill="rgba(71,85,105,0.05)" stroke="#94a3b8" stroke-width="0.6" opacity="0.5"/>
    <line x1="-52" y1="-34" x2="12" y2="-34" stroke="#94a3b8" stroke-width="0.4" opacity="0.35"/>
    <line x1="-52" y1="-26" x2="-5" y2="-26" stroke="#94a3b8" stroke-width="0.4" opacity="0.35"/>
    <line x1="-52" y1="-18" x2="5" y2="-18" stroke="#94a3b8" stroke-width="0.4" opacity="0.35"/>
    <!-- Platter -->
    <circle cx="12" cy="10" r="34" fill="rgba(71,85,105,0.03)" stroke="#475569" stroke-width="1.2"/>
    <circle cx="12" cy="10" r="22" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.3"/>
    <circle cx="12" cy="10" r="10" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.3"/>
    <!-- Spindle -->
    <circle cx="12" cy="10" r="3.5" fill="rgba(71,85,105,0.12)" stroke="#475569" stroke-width="0.8"/>
    <!-- Actuator arm -->
    <path d="M58,-34 L58,10 L22,10" fill="none" stroke="#475569" stroke-width="1.2" opacity="0.5"/>
    <circle cx="22" cy="10" r="2" fill="#475569" opacity="0.3"/>
    <!-- Screw holes -->
    <circle cx="-64" cy="-44" r="2.5" fill="none" stroke="#94a3b8" stroke-width="0.6" opacity="0.3"/>
    <circle cx="64" cy="-44" r="2.5" fill="none" stroke="#94a3b8" stroke-width="0.6" opacity="0.3"/>
    <circle cx="-64" cy="34" r="2.5" fill="none" stroke="#94a3b8" stroke-width="0.6" opacity="0.3"/>
    <circle cx="64" cy="34" r="2.5" fill="none" stroke="#94a3b8" stroke-width="0.6" opacity="0.3"/>
    <!-- SATA connectors -->
    <rect x="-52" y="38" width="22" height="4" rx="1" fill="rgba(71,85,105,0.06)" stroke="#94a3b8" stroke-width="0.6" opacity="0.5"/>
    <rect x="-24" y="38" width="14" height="4" rx="1" fill="rgba(71,85,105,0.06)" stroke="#94a3b8" stroke-width="0.6" opacity="0.5"/>
  </g>
  <text x="200" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">HDD Storage</text>
</svg>