name: Build and deploy staging

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: swadestack-staging
  cancel-in-progress: true

env:
  BACKEND_IMAGE: ghcr.io/samir120/swadestack-backend
  FRONTEND_IMAGE: ghcr.io/samir120/swadestack-frontend

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout application
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Lint backend
        run: npm run lint

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout application
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  build:
    name: Build and push container images
    needs:
      - backend-quality
      - frontend-quality

    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  update-gitops:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v6
        with:
          repository: Samir120/swadestack-k8s
          token: ${{ secrets.GITOPS_TOKEN }}
          path: swadestack-k8s

      - name: Update staging image tags
        working-directory: swadestack-k8s
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i \
            -E "s#(newTag: )[a-f0-9]+#\1${IMAGE_TAG}#g" \
            apps/swadestack/overlays/staging/kustomization.yaml

      - name: Validate GitOps manifests
        working-directory: swadestack-k8s
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- apps/swadestack; then
            echo "Merge conflict markers found"
            exit 1
          fi

          kubectl kustomize apps/swadestack/overlays/staging >/dev/null

      - name: Verify staging image update
        working-directory: swadestack-k8s
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          grep -A8 '^images:' \
            apps/swadestack/overlays/staging/kustomization.yaml

          COUNT=$(grep -c "newTag: ${IMAGE_TAG}" \
            apps/swadestack/overlays/staging/kustomization.yaml)

          if [ "$COUNT" -ne 2 ]; then
            echo "Expected both staging images to use ${IMAGE_TAG}"
            exit 1
          fi

      - name: Commit and push GitOps change
        working-directory: swadestack-k8s
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "swadestack-ci"
          git config user.email "swadestack-ci@users.noreply.github.com"

          git add apps/swadestack/overlays/staging/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes required"
            exit 0
          fi

          git commit -m "Deploy swadestack ${IMAGE_TAG} to staging"
          git push origin main
